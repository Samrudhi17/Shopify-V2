services:
  db:
    # MySQL publishes native linux/arm64 images, so this runs on Hetzner's
    # Ampere (CAX) servers as well as x86.
    image: mysql:8
    container_name: qrshop-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_DATABASE: QRShopDb
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  api:
    build:
      context: ./backend/QRShop.API
    container_name: qrshop-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Server=db;Port=3306;Database=QRShopDb;User=root;Password=${DB_PASSWORD};
      # Used to build each shop's public catalog URL (domain/shopname).
      AppSettings__PublicBaseUrl: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env}
      Jwt__Issuer: QRShop.API
      Jwt__Audience: QRShop.Client
      # The API verifies the client's Firebase ID tokens against this project.
      # The container has no .env of its own, so anything the API reads has to be
      # listed here explicitly.
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-${VITE_FIREBASE_PROJECT_ID:?set VITE_FIREBASE_PROJECT_ID in .env}}
      # Razorpay. Left empty the app still runs and the pricing page still loads;
      # only starting a payment fails, with a message saying what is missing.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      # Gemini product descriptions. Empty key just disables the Generate button.
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/}
      AI_MODEL: ${AI_MODEL:-gemini-flash-latest}
    volumes:
      # Uploaded images/certificates/QR codes must outlive the container.
      - uploads:/app/wwwroot/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    container_name: qrshop-web
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mysql-data:
  uploads:
