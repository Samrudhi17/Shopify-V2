server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Product images and shop-act certificates can be up to 10 MB
    # (nginx defaults to 1 MB, which would reject valid uploads).
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- API ----
    location /api/ {
        proxy_pass         http://api:8080/api/;
        proxy_http_version 1.1;
        # $http_host keeps the port ($host drops it), so generated file URLs
        # stay correct when the site runs on a non-standard port.
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $http_host;
    }

    # ---- Uploaded files (served by the backend from wwwroot/uploads) ----
    location /uploads/ {
        proxy_pass       http://api:8080/uploads/;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ---- Static assets ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- SPA fallback ----
    # Client-side routes like /mulchand or /vendor/products must return
    # index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;

        # index.html names the hashed bundle, so a cached copy pins the browser
        # to the previous deploy's JavaScript — new pages appear missing until
        # the user clears their cache. The file is tiny; always revalidate it.
        add_header Cache-Control "no-cache";
    }
}
